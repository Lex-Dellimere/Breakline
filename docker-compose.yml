# dev database for cloud/. port 5433 so it does not clash with other local postgres instances.
services:
  db:
    image: postgres:17
    container_name: breakline-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - breakline-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  breakline-pg-data:
